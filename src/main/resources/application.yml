server:
  port: ${APP_SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
#    context-path: /api
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mariadb://localhost:3306/desafio}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
  sql:
    init:
      platform: mariadb
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        hbm2ddl:
          auto: update	
